# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    - '\b(software|backend|back-end|server|platform|infrastructure|infra|systems|distributed|cloud)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|infrastructure|infra|systems|distributed)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'
    # backend / AI track — matches the Python, Golang and GenAI-pipeline
    # background in profile.json.
    - '\b(backend|back-end|software|python|golang|go|api)\s+developer\b'
    - '\b(ai|ml|ai/ml|genai|generative ai|llm|machine learning|applied ai)\b.*\bengineer\b'
    - '\bfull[\s-]?stack\b.*\b(engineer|developer)\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect|lead)\b' # too senior for now
    - '\b(sr\.?|iii|iv|3|4|l[4-9])\b'                             # SDE III / L4 and up
    # "Senior" at 1.5 years is a consistent 3-4 from the screener — dropping it
    # here is free, dropping it after an LLM call is not. Delete this line once
    # you are ~4 years in, or if you want to stretch-apply anyway.
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|trainee)\b'                # too junior
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b' # wrong discipline
    - '\b(data scientist|machine learning scientist|research scientist)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - india
    # Open to relocating anywhere in India. Boards often give a bare city
    # with no country, so the major hubs are listed by name as well.
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - mumbai
    - navi mumbai
    - delhi
    - new delhi
    - ncr
    - gurgaon
    - gurugram
    - noida
    - chennai
    - kolkata
    - ahmedabad
    - jaipur
    - kochi
    - coimbatore
    - indore
    - chandigarh
    - thiruvananthapuram

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Remote roles pass only if their location names one of these, or names
  # nowhere at all (a bare "Remote"). Without this, "Remote - USA" gets through
  # and costs a screening call to reject. Leave empty to accept any remote role.
  remote_regions:
    - india
    - global
    - worldwide
    - anywhere
    - apac
    - asia

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run
near_miss_margin: 1.5     # list jobs this far under the threshold as "close
                          # calls" (no draft). 0 turns the section off.

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
